name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:      # réutilisé par python-publish.yml avant toute publication

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check that the built-in reference is packaged
        run: |
          unzip -l dist/*.whl | grep -q "macsima_qc/data/reference_segmentation.csv" \
            || { echo "reference_segmentation.csv missing from wheel"; exit 1; }
          tar -tzf dist/*.tar.gz | grep -q "macsima_qc/data/reference_segmentation.csv" \
            || { echo "reference_segmentation.csv missing from sdist"; exit 1; }

      - name: Install the built wheel (not editable, to test what users get)
        run: |
          pip install pytest
          pip install dist/*.whl

      - name: Run tests
        run: |
          # `pytest` (not `python -m pytest`) so the repo root is not on sys.path
          # and the installed wheel is imported, not the source folder.
          pytest tests/ -v